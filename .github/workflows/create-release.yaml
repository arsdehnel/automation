name: Create Release

on:
  workflow_call:

jobs:
  create-release:
    runs-on: ubuntu-latest
    concurrency:
      group: create-release
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
          registry-url: 'https://npm.pkg.github.com'

      - name: Install dependencies
        run: pnpm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Disable main ruleset
        run: |
          RULESET_ID=$(curl --fail-with-body -s \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/rulesets" \
            | jq '.[] | select(.name == "main") | .id')
          echo "RULESET_ID=$RULESET_ID" >> "$GITHUB_ENV"
          curl --fail-with-body -s -X PUT \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/rulesets/$RULESET_ID" \
            -d '{"enforcement":"disabled"}'
        env:
          GITHUB_TOKEN: ${{ secrets.ARSDEHNEL_GITHUB_TOKEN }}

      - name: Create release
        run: |
          pnpm dlx \
            --package=semantic-release@25 \
            --package=@semantic-release/commit-analyzer@13 \
            --package=@semantic-release/release-notes-generator@14 \
            --package=@semantic-release/changelog@7 \
            --package=@semantic-release/npm@13 \
            --package=@semantic-release/git@11 \
            --package=@semantic-release/github@12 \
            --package=conventional-changelog-conventionalcommits@9 \
            semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.ARSDEHNEL_GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: semantic-release-bot
          GIT_AUTHOR_EMAIL: semantic-release-bot@users.noreply.github.com
          GIT_COMMITTER_NAME: semantic-release-bot
          GIT_COMMITTER_EMAIL: semantic-release-bot@users.noreply.github.com
          HUSKY: 0

      - name: Restore main ruleset to active
        if: always()
        run: |
          curl --fail-with-body -s -X PUT \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/rulesets/$RULESET_ID" \
            -d '{"enforcement":"active"}'
        env:
          GITHUB_TOKEN: ${{ secrets.ARSDEHNEL_GITHUB_TOKEN }}
